# ==============================================
# 橙の语 —— 二次元 × 商务 主题配置
# 修改后无需重启服务器，刷新页面即可生效
# ==============================================

# ---- 图片目录规范（图片统一放 source/images/ 下分类管理） ----
#   site/   网站级图片：全站背景、首页 Banner、Logo、favicon
#   posts/  文章配图：建议 posts/<文章文件名>/xxx.jpg，封面/横幅也放这里
#   charts/ 图表图：数据图表、架构图、示意图
#   misc/   其他杂项图片

# ---- 引用方式 ----
# 全站背景图（可选）：留空则使用默认橙黄渐变背景
background: ''
#   例：background: /images/site/bg.jpg
# 首页大 Banner（可选）：留空则使用默认渐变 Hero
banner: /images/site/gap-bg.webp
#   例：banner: /images/site/banner.jpg
# 文章页 Banner：在文章 front-matter 写 banner: /images/posts/<文章名>/banner.jpg
# 文章卡片封面：在文章 front-matter 写 cover: /images/posts/<文章名>/cover.jpg
# 正文插图/图表：直接写 ![](/images/charts/xxx.png)

# 首页欢迎语
greeting: 你好呀，欢迎光临金苹果派的小破站~

# 导航菜单（键 = 显示文字，值 = 链接）
menu:
  首页: /
  归档: /archives/
  分类: /categories/
  标签: /tags/
  关于: /about/

# 社交链接（显示文字 -> URL，可自行增删）
